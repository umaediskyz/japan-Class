<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=pesan.html?tab=calls">
    <script>window.location.replace("pesan.html?tab=calls");</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kaiwa Live · Simulasi Obrolan Langsung | Nihongo Fournity</title>
    <meta name="description" content="Latih percakapan bahasa Jepang (Kaiwa) dengan simulasi panggilan video interaktif realistis bergaya iOS. Dilengkapi subtitle live captions dan fitur panggilan acak.">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/kaiwa.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="kaiwa-body">

    <!-- Ambient Glow Background -->
    <div class="kaiwa-ambient-bg" aria-hidden="true"></div>

    <!-- ==========================================================================    <!-- ==========================================================================
         LOBBY KONTAK iOS (HALAMAN KONTAK NYATA BERGAYA iOS)
         ========================================================================== -->
    <main class="ios-phone-app-container" id="kaiwaLobbyView">
        <!-- Top Nav Header iOS -->
        <header class="ios-top-nav-header">
            <a href="../index.html" class="ios-nav-link-btn" id="btnBackToHome">
                <svg class="ios-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>Dashboard</span>
            </a>
            <div class="ios-nav-center-title">Kontak</div>
            <div class="ios-nav-right-slot">
                <span class="ios-badge-live">LIVE</span>
            </div>
        </header>

        <!-- Big Bold Title "Kontak" -->
        <div class="ios-title-row">
            <h1 class="ios-large-contacts-title">Kontak</h1>
        </div>

        <!-- iOS Search Bar -->
        <div class="ios-search-wrapper">
            <div class="ios-search-bar">
                <svg class="ios-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="contactSearchInput" class="ios-search-input" placeholder="Cari kontak, kota, atau topik..." autocomplete="off">
                <button type="button" id="btnClearSearch" class="ios-search-clear-btn" style="display: none;" aria-label="Hapus Pencarian">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
                </button>
            </div>
        </div>

        <!-- "Kartu Pengguna Saya" (My Card) -->
        <div class="ios-my-card-box">
            <div class="ios-my-card-avatar">
                <svg class="ios-svg-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <div class="ios-my-card-meta">
                <div class="ios-my-card-title">Kartu Pengguna Saya</div>
                <div class="ios-my-card-sub">Siap Melatih Percakapan (日本語会話)</div>
            </div>
        </div>

        <!-- Hero FaceTime / Panggilan Acak Banner -->
        <div class="ios-random-facetime-card" id="btnTriggerRandomCall" role="button" tabindex="0">
            <div class="facetime-icon-circle">
                <svg class="speed-dial-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"></circle>
                    <circle cx="15.5" cy="8.5" r="1.5" fill="currentColor"></circle>
                    <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
                    <circle cx="8.5" cy="15.5" r="1.5" fill="currentColor"></circle>
                    <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"></circle>
                </svg>
            </div>
            <div class="facetime-card-text">
                <div class="facetime-card-title">Panggilan Acak (Random Call)</div>
                <div class="facetime-card-desc">Hubungi teman bicara secara spontan tanpa memilih</div>
            </div>
            <button type="button" class="btn-facetime-call-pill">
                <svg class="ios-btn-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                <span>Acak</span>
            </button>
        </div>

        <!-- Filter Segmented Control iOS -->
        <div class="ios-segmented-bar" role="tablist">
            <button type="button" class="kaiwa-tab-btn is-active" data-filter="all">Semua</button>
            <button type="button" class="kaiwa-tab-btn" data-filter="cewek">Mahasiswi</button>
            <button type="button" class="kaiwa-tab-btn" data-filter="kafe">Kafe</button>
            <button type="button" class="kaiwa-tab-btn" data-filter="travel">Wisata</button>
        </div>

        <!-- Inset Grouped Contacts Container -->
        <section class="ios-contacts-grouped-list" id="contactsGrid" aria-label="Daftar Kontak"></section>

        <!-- iOS Bottom Tab Bar (Phone App Bar) -->
        <nav class="ios-bottom-phone-bar" aria-label="Navigasi Bawah">
            <button type="button" class="ios-phone-tab-btn" id="tabNavFavorites">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                <span>Favorit</span>
            </button>
            <button type="button" class="ios-phone-tab-btn is-active" id="tabNavContacts">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Kontak</span>
            </button>
            <button type="button" class="ios-phone-tab-btn" id="tabNavRandom">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"></circle>
                    <circle cx="15.5" cy="8.5" r="1.5" fill="currentColor"></circle>
                    <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
                    <circle cx="8.5" cy="15.5" r="1.5" fill="currentColor"></circle>
                    <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"></circle>
                </svg>
                <span>Panggilan Acak</span>
            </button>
            <a href="pesan.html" class="ios-phone-tab-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>Pesan</span>
            </a>
        </nav>
    </main>

    <!-- ==========================================================================
         SIMULASI 1: LAYAR BERDERING iOS (OUTGOING CALLING SCREEN - 6 DETIK)
         ========================================================================== -->
    <div id="callingOverlayModal" class="calling-overlay-modal" style="display: none;" role="dialog" aria-modal="true" aria-label="Memanggil">
        <div class="calling-center-content">
            <div class="calling-avatar-ripple-box">
                <span class="calling-ripple"></span>
                <span class="calling-ripple r2"></span>
                <span class="calling-ripple r3"></span>
                <img id="callingAvatarImg" src="" alt="Lawan Bicara" class="calling-avatar-img">
            </div>

            <h2 class="calling-target-name" id="callingTargetName">Sakura-chan</h2>
            <div class="calling-target-jp" id="callingTargetJp">さくら · 渋谷</div>
            <div class="calling-status-text" id="callingStatusText">
                <svg class="ios-svg-icon spin-slow" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
                <span>Berdering... (呼び出し中)</span>
            </div>
        </div>

        <div class="calling-bottom-bar">
            <button type="button" class="btn-cancel-call" id="btnCancelCalling" aria-label="Batalkan Panggilan">
                <svg class="ios-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <span class="cancel-call-label">Batalkan</span>
        </div>
    </div>

    <!-- ==========================================================================
         SIMULASI 2: LAYAR PANGGILAN TERHUBUNG iOS (IN-CALL CONNECTED SCREEN - REALISTIS)
         ========================================================================== -->
    <div id="connectedCallOverlay" class="connected-call-overlay" style="display: none;" role="dialog" aria-modal="true" aria-label="Panggilan Aktif">
        <div class="call-viewport-wrapper">
            
            <!-- POSISI DETIK HIJAU DI PALING ATAS LAYAR -->
            <div class="top-call-timer-pill" id="callTimerDisplay">
                <span class="timer-green-dot"></span>
                <span id="callDurationText">00:00</span>
            </div>

            <!-- Header: Foto Profil Lawan Bicara (Ukuran Besar) & Nama -->
            <div class="call-header-info">
                <div class="call-header-avatar-wrap">
                    <img id="connectedAvatarImg" src="" alt="Avatar" class="call-header-avatar">
                    <span class="call-header-live-badge"></span>
                </div>
                <h3 class="call-header-name" id="connectedCallerName">Sakura-chan</h3>
            </div>

            <!-- AREA VIDEO HORIZONTAL (MP4 PLAYER + MINIMALIST FALLBACK) -->
            <div class="kaiwa-video-stage">
                <!-- Video Element Horizontal (Otomatis Memutar) -->
                <video id="kaiwaVideoElement" class="kaiwa-video-element" playsinline loop autoplay muted></video>

                <!-- Fallback Natural (Seperti Kamera Off pada FaceTime Asli) -->
                <div class="video-fallback-studio" id="videoFallbackStudio" style="display: none;">
                    <div class="studio-avatar-box">
                        <img id="studioAvatarImg" src="" alt="Lawan Bicara" class="studio-avatar-img">
                    </div>
                    <div class="studio-wave-equalizer">
                        <span class="studio-eq-bar"></span>
                        <span class="studio-eq-bar"></span>
                        <span class="studio-eq-bar"></span>
                        <span class="studio-eq-bar"></span>
                        <span class="studio-eq-bar"></span>
                    </div>
                </div>
            </div>

            <!-- TOMBOL KONTROL PANGGILAN iOS (REAL SVG ICONS - PINNED DI PALING BAWAH) -->
            <!-- Kiri: Speaker | Tengah: Akhiri Merah | Kanan: Volume -->
            <div class="ios-call-controls-dock">
                <!-- Kiri: Logo Speaker untuk Membisukan Suara Video -->
                <div class="call-control-item">
                    <button type="button" class="call-control-btn btn-speaker-control" id="btnKaiwaSpeakerMute" aria-label="Speaker / Mute">
                        <span id="speakerIconSlot">
                            <!-- SVG Speaker On -->
                            <svg class="ios-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
                                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                            </svg>
                        </span>
                    </button>
                    <span class="call-control-label" id="labelSpeakerMute">Speaker</span>
                </div>

                <!-- Tengah: Tombol Akhiri Panggilan Berwarna Merah iOS (Hangup SVG Real) -->
                <div class="call-control-item">
                    <button type="button" class="call-control-btn btn-end-call-main" id="btnKaiwaEndCall" aria-label="Akhiri Panggilan">
                        <svg class="ios-svg-icon end-call-svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 9c-3.15 0-6.07 1.09-8.41 2.92-.72.56-.84 1.58-.29 2.3l1.32 1.76c.45.6 1.3.74 1.93.31 1.63-1.12 3.51-1.89 5.45-1.89s3.82.77 5.45 1.89c.63.43 1.48.29 1.93-.31l1.32-1.76c.55-.72.43-1.74-.29-2.3C18.07 10.09 15.15 9 12 9z"/>
                        </svg>
                    </button>
                    <span class="call-control-label" style="color: #ff6961;">Akhiri</span>
                </div>

                <!-- Kanan: Tombol Volume / Audio Adjust (Sliders SVG Real) -->
                <div class="call-control-item">
                    <button type="button" class="call-control-btn btn-volume-control" id="btnKaiwaVolumeControl" aria-label="Volume">
                        <svg class="ios-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" y1="21" x2="4" y2="14"></line>
                            <line x1="4" y1="10" x2="4" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12" y2="3"></line>
                            <line x1="20" y1="21" x2="20" y2="16"></line>
                            <line x1="20" y1="12" x2="20" y2="3"></line>
                            <line x1="1" y1="14" x2="7" y2="14"></line>
                            <line x1="9" y1="8" x2="15" y2="8"></line>
                            <line x1="17" y1="16" x2="23" y2="16"></line>
                        </svg>
                    </button>
                    <span class="call-control-label" id="labelVolumeControl">Volume</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Script Logika Simulasi Kaiwa -->
    <script src="kaiwa.js"></script>
</body>
</html>
